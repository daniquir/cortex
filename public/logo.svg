<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradientes Verde Ácido -->
    <linearGradient id="acidGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EFF00" />
      <stop offset="50%" stop-color="#39E600" />
      <stop offset="100%" stop-color="#00B33C" />
    </linearGradient>

    <linearGradient id="acidGreenHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4FF70" />
      <stop offset="100%" stop-color="#1FA300" />
    </linearGradient>

    <!-- Gradientes Metálicos Silver/Steel -->
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="silverBevel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="darkBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gradiente Núcleo Neón -->
    <radialGradient id="coreGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#00FF88" />
      <stop offset="70%" stop-color="#00AD45" />
      <stop offset="100%" stop-color="#003B15" />
    </radialGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </radialGradient>

    <!-- Filtros de Sombra y Resplandor -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    
    <!-- C VERDE ÁCIDO -->
    <g id="letter-C">
      <path d="M 325 142 C 300 130, 265 120, 220 120 C 145 120, 90 180, 90 256 C 90 332, 145 392, 220 392 C 265 392, 300 382, 325 370 A 24 24 0 0 0 336 328 L 332 328 A 16 16 0 0 0 318 338 C 292 350, 260 356, 220 356 C 165 356, 128 312, 128 256 C 128 200, 165 156, 220 156 C 260 156, 292 162, 318 174 A 16 16 0 0 0 332 184 L 336 184 A 24 24 0 0 0 325 142 Z" fill="url(#acidGreenGrad)" stroke="#15803D" stroke-width="1.5" />
      <path d="M 325 142 C 300 130, 265 120, 220 120 C 145 120, 90 180, 90 256 C 90 332, 145 392, 220 392 C 265 392, 300 382, 325 370" fill="none" stroke="url(#acidGreenHighlight)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 310 158 C 285 148, 255 140, 220 140 C 152 140, 108 190, 108 256 C 108 322, 152 372, 220 372 C 255 372, 285 364, 310 354" fill="none" stroke="#166534" stroke-width="5" stroke-linecap="round"/>
      <path d="M 310 158 C 285 148, 255 140, 220 140 C 152 140, 108 190, 108 256 C 108 322, 152 372, 220 372 C 255 372, 285 364, 310 354" fill="none" stroke="#052E16" stroke-width="2" stroke-linecap="round"/>
      <circle cx="310" cy="158" r="6" fill="url(#silverMetal)" stroke="#15803D" stroke-width="2"/>
      <circle cx="310" cy="354" r="6" fill="url(#silverMetal)" stroke="#15803D" stroke-width="2"/>
    </g>

    <!-- X METÁLICA -->
    <g id="letter-X">
      <path d="M 245 155 L 305 155 L 430 330 L 430 357 L 370 357 L 245 182 Z" fill="url(#darkBevel)"/>
      <path d="M 245 357 L 305 357 L 430 182 L 430 155 L 370 155 L 245 330 Z" fill="url(#darkBevel)"/>
      <path d="M 240 150 L 295 150 L 425 335 L 425 362 L 370 362 L 240 177 Z" fill="url(#silverMetal)" stroke="#475569" stroke-width="1.5"/>
      <path d="M 240 150 L 295 150 L 425 335 L 425 362 Z" fill="url(#silverBevel)" opacity="0.6"/>
      <path d="M 270 168 L 400 350" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
      <path d="M 270 168 L 400 350" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 240 362 L 295 362 L 425 177 L 425 150 L 370 150 L 240 335 Z" fill="url(#silverMetal)" stroke="#475569" stroke-width="1.5"/>
      <path d="M 240 362 L 295 362 L 425 177 L 425 150 Z" fill="url(#silverBevel)" opacity="0.4"/>
      <path d="M 270 344 L 400 162" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
      <path d="M 270 344 L 400 162" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- NÚCLEO IA GLOWING -->
    <g id="core-node">
      <circle cx="332" cy="256" r="45" fill="url(#ambientGlow)"/>
      <circle cx="332" cy="256" r="26" fill="url(#silverMetal)" stroke="#1E293B" stroke-width="2"/>
      <circle cx="332" cy="256" r="20" fill="#0F172A"/>
      <path d="M 332 230 A 26 26 0 0 1 358 256" fill="none" stroke="#00FF66" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 332 282 A 26 26 0 0 1 306 256" fill="none" stroke="#00FF66" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="332" cy="256" r="14" fill="url(#coreGlowGrad)" filter="url(#glowEffect)"/>
      <circle cx="332" cy="256" r="14" fill="url(#coreGlowGrad)"/>
      <circle cx="328" cy="252" r="4" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- CÓDIGO <> (OPCIONAL) -->
    <g id="code-brackets" opacity="0.85">
      <path d="M 115 390 L 95 405 L 115 420" fill="none" stroke="url(#acidGreenGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 135 390 L 155 405 L 135 420" fill="none" stroke="url(#acidGreenGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
