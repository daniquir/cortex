<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Verde Ácido -->
    <linearGradient id="acidGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#A8FF00" />
    </linearGradient>

    <!-- Filtro de Resplandor (Neon Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Hexagonal (Estilo Icono de Editor/Dev) -->
  <polygon points="256,32 448,142 448,370 256,480 64,370 64,142" fill="#0D1117" stroke="#21262D" stroke-width="8"/>

  <!-- Circuito / Cresta Neocórtex Interna -->
  <g filter="url(#glow)">
    <!-- Rayo de Energía / Estructura 'N' Ciber -->
    <path d="M 160,360 L 160,160 L 280,320 L 280,160" fill="none" stroke="url(#acidGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Conexión Neuronal Superior (La marca de Cortex) -->
    <circle cx="352" cy="160" r="20" fill="#00FF66" />
    <line x1="280" y1="160" x2="352" y2="160" stroke="#00FF66" stroke-width="12" stroke-dasharray="8 8" />

    <!-- Núcleo de Entrada/Salida (Prompt Agent) -->
    <circle cx="160" cy="360" r="12" fill="#0D1117" stroke="#00FF66" stroke-width="8" />
  </g>

  <!-- Detalle Ciber / Código (<>) Estilizado en verde -->
  <path d="M 320,280 L 360,320 L 320,360" fill="none" stroke="#00FF66" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
